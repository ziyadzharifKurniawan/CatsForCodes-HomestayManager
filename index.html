<!DOCTYPE html>
<html>
<head>
  <title>Homestay Dashboard</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
    }

    form {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    input, select, button {
      padding: 10px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    tr:hover {
      background: #f1f1f1;
    }

    .details {
      display: none;
      background: #fafafa;
    }

    .details td {
      padding: 15px;
    }

    .expand-btn {
      cursor: pointer;
      color: blue;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Homestay Booking System</h1>

  <!-- FULL FORM -->
  <form id="form">
    <input id="guest_name" placeholder="Guest Name" required>
    <input id="persons" type="number" placeholder="Persons" required>
    <input id="check_in_date" type="date" required>

    <input id="property" placeholder="Property (e.g. Petra)">
    
    <select id="payment_method">
      <option>Cash / Tunai</option>
      <option>Transfer</option>
      <option>Online</option>
    </select>

    <input id="revenue_total" placeholder="Revenue">

    <button type="submit">Add Booking</button>
  </form>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Guest</th>
        <th>Persons</th>
        <th>Expand</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
const API = "http://localhost:3000/bookings";

async function loadBookings() {
  const res = await fetch(API);
  const data = await res.json();

  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  data.forEach(b => {
    const row = `
      <tr>
        <td>${b.id}</td>
        <td>${b.guest_name || "-"}</td>
        <td>${b.persons}</td>
        <td class="expand-btn" onclick="toggle(${b.id})">View</td>
      </tr>

      <tr id="details-${b.id}" class="details">
        <td colspan="4">
          <b>Property:</b> ${b.property || "-"} <br>
          <b>Payment:</b> ${b.payment_method || "-"} <br>
          <b>Revenue:</b> ${b.revenue_total || "-"} <br>
          <b>Check-in:</b> ${b.check_in_date}
        </td>
      </tr>
    `;
    tbody.innerHTML += row;
  });
}

function toggle(id) {
  const row = document.getElementById("details-" + id);
  row.style.display = row.style.display === "table-row" ? "none" : "table-row";
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {
    guest_name: document.getElementById("guest_name").value,
    persons: document.getElementById("persons").value,
    check_in_date: document.getElementById("check_in_date").value,
    property: document.getElementById("property").value,
    payment_method: document.getElementById("payment_method").value,
    revenue_total: document.getElementById("revenue_total").value
  };

  await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  loadBookings();
});

loadBookings();
</script>

</body>
</html>
